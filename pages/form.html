<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <title>SNEAKER VAULT | CMS FORM</title>
</head>
<body class="bg-white text-black flex min-h-screen font-sans">
    <aside class="w-64 border-r-4 border-black flex flex-col p-6 shrink-0">
        <div class="mb-12">
            <h1 class="text-2xl font-black italic tracking-tighter">SV ADMIN</h1>
            <p class="text-[10px] font-bold opacity-50 tracking-widest uppercase mt-1">MANAGEMENT PANEL</p>
        </div>
        <nav class="flex-grow">
            <ul class="space-y-4 font-black text-sm tracking-wider">
                <li>
                    <a href="list.html" class="block p-3 border-2 border-black hover:bg-black hover:text-white transition-all uppercase">
                        PRODUCTS
                    </a>
                </li>
                <li>
                    <a href="categories.html" class="block p-3 border-2 border-black hover:bg-black hover:text-white transition-all uppercase">
                        CATEGORIES
                    </a>
                </li>
                <li>
                    <a href="add-staff.html" class="block p-3 border-2 border-black hover:bg-black hover:text-white transition-all uppercase">
                        ADD STAFF
                    </a>
                </li>
            </ul>
        </nav>
        <div class="mt-auto border-t-2 border-black pt-4">
            <a href="login.html" class="block font-black text-sm tracking-wider text-red-600 hover:underline uppercase">
                LOGOUT →
            </a>
        </div>
    </aside>
    <main class="flex-grow p-10">
        <header class="mb-12">
            <h2 class="text-4xl font-black uppercase tracking-tighter">PRODUCT FORM</h2>
            <p class="text-sm font-bold opacity-60 uppercase mt-1">CREATE OR EDIT YOUR SNEAKER DATA</p>
        </header>
        <section class="max-w-2xl border-4 border-black p-8 shadow-[12px_12px_0px_0px_rgba(0,0,0,1)] bg-white">
            <form action="list.html">
                <div class="grid grid-cols-1 gap-6">
                    <div>
                        <label class="block font-black text-xs uppercase mb-2 tracking-widest">PRODUCT NAME</label>
                        <input type="text" placeholder="e.g. TRAVIS SCOTT AJ1" required
                            class="w-full p-4 border-2 border-black font-bold focus:outline-none focus:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] transition-all">
                    </div>
                    <div>
                        <label class="block font-black text-xs uppercase mb-2 tracking-widest">CATEGORY</label>
                        <select required class="w-full p-4 border-2 border-black font-bold focus:outline-none bg-white cursor-pointer">
                            <option value="">SELECT CATEGORY</option>
                            <option value="1">LIMITED EDITION</option>
                            <option value="2">GENERAL RELEASE</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block font-black text-xs uppercase mb-2 tracking-widest">PRICE (RP)</label>
                            <input type="number" placeholder="25000000" required
                                class="w-full p-4 border-2 border-black font-bold focus:outline-none focus:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] transition-all">
                        </div>
                        <div>
                            <label class="block font-black text-xs uppercase mb-2 tracking-widest">STOCK</label>
                            <input type="number" placeholder="10" required
                                class="w-full p-4 border-2 border-black font-bold focus:outline-none focus:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] transition-all">
                        </div>
                    </div>
                    <div>
                        <label class="block font-black text-xs uppercase mb-2 tracking-widest">DESCRIPTION</label>
                        <textarea placeholder="ENTER PRODUCT DETAILS..." rows="4" required
                            class="w-full p-4 border-2 border-black font-bold focus:outline-none focus:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] transition-all resize-none"></textarea>
                    </div>
                    <div>
                        <label class="block font-black text-xs uppercase mb-2 tracking-widest">IMAGE URL (TEXT)</label>
                        <input type="text" placeholder="https://image-link.com/photo.jpg" required
                            class="w-full p-4 border-2 border-black font-bold focus:outline-none focus:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] transition-all">
                    </div>
                    <div class="flex gap-4 pt-4">
                        <button type="submit" 
                            class="flex-grow bg-black text-white py-4 font-black border-2 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] transition-all uppercase">
                            SAVE PRODUCT
                        </button>
                        <a href="list.html" 
                            class="px-8 py-4 border-2 border-black font-black hover:bg-gray-100 transition-all text-center uppercase">
                            CANCEL
                        </a>
                    </div>

                </div>
            </form>
        </section>
    </main>
</body>
</html>
