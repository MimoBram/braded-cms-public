<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <title>SNEAKER VAULT | CMS CATEGORIES</title>
</head>
<body class="bg-white text-black flex min-h-screen font-sans">
    <aside class="w-64 border-r-4 border-black flex flex-col p-6 shrink-0">
        <div class="mb-12">
            <h1 class="text-2xl font-black italic tracking-tighter">SV ADMIN</h1>
            <p class="text-[10px] font-bold opacity-50 tracking-widest uppercase mt-1">MANAGEMENT PANEL</p>
        </div>
        <nav class="flex-grow">
            <ul class="space-y-4 font-black text-sm tracking-wider">
                <li>
                    <a href="list.html" class="block p-3 border-2 border-black hover:bg-black hover:text-white transition-all uppercase">
                        PRODUCTS
                    </a>
                </li>
                <li>
                    <a href="categories.html" class="block p-3 border-2 border-black bg-black text-white shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] uppercase">
                        CATEGORIES
                    </a>
                </li>
                <li>
                    <a href="add-staff.html" class="block p-3 border-2 border-black hover:bg-black hover:text-white transition-all uppercase">
                        ADD STAFF
                    </a>
                </li>
            </ul>
        </nav>
        <div class="mt-auto border-t-2 border-black pt-4">
            <a href="login.html" class="block font-black text-sm tracking-wider text-red-600 hover:underline uppercase">
                LOGOUT →
            </a>
        </div>
    </aside>
    <main class="flex-grow p-10">
        <header class="flex justify-between items-center mb-12">
            <div>
                <h2 class="text-4xl font-black uppercase tracking-tighter">CATEGORY LIST</h2>
                <p class="text-sm font-bold opacity-60 uppercase mt-1">MANAGE SECONDARY ENTITY DATA</p>
            </div>
        </header>
        <div class="max-w-3xl border-4 border-black shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-black text-white border-b-2 border-black font-black text-sm tracking-wider uppercase">
                        <th class="p-4 w-1/4">CATEGORY ID</th>
                        <th class="p-4 w-1/2">CATEGORY NAME</th>
                        <th class="p-4 w-1/4 text-center">ACTIONS</th>
                    </tr>
                </thead>
                <tbody class="divide-y-2 divide-black font-bold text-sm">
                    <tr class="hover:bg-gray-50 transition-all">
                        <td class="p-4 opacity-50">CAT-001</td>
                        <td class="p-4 uppercase font-black text-base">LIMITED EDITION</td>
                        <td class="p-4">
                            <div class="flex justify-center gap-3">
                                <button class="px-3 py-1 border-2 border-black bg-white font-black text-red-600 hover:bg-red-600 hover:text-white transition-all text-xs uppercase cursor-pointer">
                                    DELETE
                                </button>
                            </div>
                        </td>
                    </tr>
                    <tr class="hover:bg-gray-50 transition-all">
                        <td class="p-4 opacity-50">CAT-002</td>
                        <td class="p-4 uppercase font-black text-base">GENERAL RELEASE</td>
                        <td class="p-4">
                            <div class="flex justify-center gap-3">
                                <button class="px-3 py-1 border-2 border-black bg-white font-black text-red-600 hover:bg-red-600 hover:text-white transition-all text-xs uppercase cursor-pointer">
                                    DELETE
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
