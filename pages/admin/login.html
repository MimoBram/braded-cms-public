<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <title>SNEAKER VAULT | CMS LOGIN</title>
</head>
<body class="bg-white text-black min-h-screen flex items-center justify-center p-6 font-sans">
    <main class="w-full max-w-md border-4 border-black p-8 shadow-[12px_12px_0px_0px_rgba(0,0,0,1)]">
        <div class="text-center mb-8">
            <h2 class="text-4xl font-black uppercase tracking-tighter">CMS LOGIN</h2>
            <p class="text-xs font-bold opacity-60 tracking-widest mt-1 uppercase">AUTHORIZED ADMIN & STAFF ONLY</p>
        </div>
        <form action="list.html">
            <div class="mb-6">
                <label class="block font-black text-sm uppercase mb-2 tracking-wider">EMAIL ADDRESS</label>
                <input type="email" placeholder="ENTER YOUR EMAIL" required
                    class="w-full p-4 border-2 border-black font-bold focus:outline-none focus:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] transition-all placeholder:opacity-30">
            </div>
            <div class="mb-8">
                <label class="block font-black text-sm uppercase mb-2 tracking-wider">PASSWORD</label>
                <input type="password" placeholder="ENTER YOUR PASSWORD" required
                    class="w-full p-4 border-2 border-black font-bold focus:outline-none focus:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] transition-all placeholder:opacity-30">
            </div>
            <button type="submit" 
                class="w-full bg-black text-white py-4 font-black text-lg border-2 border-black hover:bg-white hover:text-black transition-all cursor-pointer">
                SIGN IN
            </button>
        </form>
        <div class="mt-8 text-center">
            <a href="../../index.html" class="font-bold text-sm tracking-wider border-b-2 border-black hover:opacity-60 transition-all uppercase">
                ← BACK TO PUBLIC SITE
            </a>
        </div>
    </main>
</body>
</html>
