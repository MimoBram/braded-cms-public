<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <title>Sneaker Vault | Home</title>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-black text-white p-6 flex justify-between items-center shadow-lg">
        <h1 class="text-3xl font-extrabold uppercase italic">Sneaker Vault</h1>
        <ul class="flex gap-6 font-semibold">
            <li><a href="index.html" class="hover:text-orange-400">Home</a></li>
            <li><a href="pages/login.html" class="hover:text-orange-400">Login</a></li>
        </ul>
    </nav>
    <main class="max-w-6xl mx-auto p-6">
        <section class="flex flex-col md:flex-row gap-4 mb-10">
            <input type="text" placeholder="Search sneakers..." class="flex-grow p-4 border-2 border-black rounded-lg">
            <select class="p-4 border-2 border-black rounded-lg bg-white font-bold">
                <option>Filter by Category</option>
            </select>
            <select class="p-4 border-2 border-black rounded-lg bg-white font-bold">
                <option>Sort by Price</option>
            </select>
        </section>
        <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <div class="bg-white p-5 border-2 border-black rounded-xl shadow-[4px_4px_0px_rgba(0,0,0,1)]">
                <img src="https://ik.imagekit.io/bramapi/ts1.jpg" alt="Sneaker" class="w-full h-60 object-cover rounded-md mb-4 border border-gray-200">
                <h2 class="text-xl font-bold mb-1">Travis Scott x AJ1</h2>
                <p class="text-gray-600 mb-2 italic text-sm">Limited</p>
                <p class="font-black text-lg mb-4">Rp 25.000.000</p>
                <a href="pages/detail.html" class="block text-center bg-black text-white py-2 rounded-md font-bold hover:bg-gray-800">Detail</a>
            </div>
        </section>
        <section class="mt-12 flex justify-center gap-2">
            <button class="px-4 py-2 border-2 border-black rounded-lg font-bold bg-white hover:bg-gray-200">Prev</button>
            <span class="px-4 py-2 border-2 border-black rounded-lg font-bold bg-orange-400 text-white">1</span>
            <button class="px-4 py-2 border-2 border-black rounded-lg font-bold bg-white hover:bg-gray-200">Next</button>
        </section>
    </main>
</body>
</html>
